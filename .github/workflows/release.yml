name: Release / Multiplatform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Binary on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: aether-linux-x64
            asset_path: dist/aether
            asset_name: aether-linux-x64
          - os: windows-latest
            artifact_name: aether-windows-x64
            asset_path: dist/aether.exe
            asset_name: aether-windows-x64.exe
          - os: macos-latest
            artifact_name: aether-macos-x64
            asset_path: dist/aether
            asset_name: aether-macos-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PyInstaller and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run PyInstaller Build
        run: |
          pyinstaller aether.spec

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      - name: Prepare Assets
        run: |
          mkdir -p final_assets
          # Linux
          if [ -f release_artifacts/aether-linux-x64/aether ]; then
            chmod +x release_artifacts/aether-linux-x64/aether
            cp release_artifacts/aether-linux-x64/aether final_assets/aether-linux-x64
          fi
          # Windows
          if [ -f release_artifacts/aether-windows-x64/aether.exe ]; then
            cp release_artifacts/aether-windows-x64/aether.exe final_assets/aether-windows-x64.exe
          fi
          # macOS
          if [ -f release_artifacts/aether-macos-x64/aether ]; then
            chmod +x release_artifacts/aether-macos-x64/aether
            cp release_artifacts/aether-macos-x64/aether final_assets/aether-macos-x64
          fi
          ls -la final_assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: final_assets/*
          generate_release_notes: true
          title: "Aether Accelerator ${{ github.ref_name }}"
